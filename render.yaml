services:
  - type: web
    name: smart-dehqon
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: smart-dehqon-db
          property: connectionString

databases:
  - name: smart-dehqon-db
