<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahsulotlar</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <a href="index.html" class="home-btn">← Bosh sahifa</a>
  <a href="admin.html" class="admin-btn">Admin</a>

  <div class="header-container">
    <img src="image/logo3.jpg" class="logo">
    <div class="brand-text">
      <h1>Smart Dehqon</h1>
      <p>Fermer va xaridorni bog‘laymiz</p>
    </div>
  </div>
</header>

<section class="products-preview">
  <h2>Barcha mahsulotlar</h2>

  <div class="products" id="products"></div>
</section>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-box">
    <div id="orderForm">
      <h3>Telefon raqamingiz</h3>
      <input type="text" id="phoneInput" placeholder="998901234567">
      <div class="popup-actions">
        <button onclick="submitOrder()">Yuborish</button>
        <button class="secondary" onclick="closePopup()">Bekor</button>
      </div>
    </div>
    
    <div id="orderSuccess" style="display:none;">
      <h3 class="success">Buyurtma qabul qilindi <br>Tez orada siz bilan bog'lanamiz !</h3>
      <button onclick="closePopup()">Yopish</button>
    </div>
  </div>
</div>

<script src="product.js"></script>
</body>
</html>
